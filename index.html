<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySync — Secure Peer Chat</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --wa-bg: #0b141a;
      --wa-header: #202c33;
      --wa-input-bg: #2a3942;
      --wa-incoming: #202c33;
      --wa-outgoing: #005c4b;
      --wa-green: #00a884;
      --wa-text: #e9edef;
      --wa-muted: #8696a0;
      --wa-border: rgba(134, 150, 160, 0.15);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #111b21;
      color: var(--wa-text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-card {
      width: 100%;
      max-width: 480px;
      height: 92vh;
      max-height: 780px;
      background: var(--wa-bg);
      border: 1px solid var(--wa-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* ENTRY / LOGIN VIEW */
    .entry-container {
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      background: var(--wa-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 168, 132, 0.3);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--wa-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .tab-group {
      display: flex;
      width: 100%;
      background: var(--wa-header);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--wa-muted);
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--wa-green);
      color: #fff;
    }

    .pin-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      width: 100%;
    }

    .pin-input {
      width: 54px;
      height: 58px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--wa-header);
      border: 1px solid var(--wa-border);
      border-radius: 12px;
      color: var(--wa-text);
      outline: none;
    }

    .pin-input:focus {
      border-color: var(--wa-green);
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--wa-green);
      color: #fff;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-action:hover { opacity: 0.9; }

    .status-msg {
      font-size: 0.85rem;
      margin-top: 16px;
      min-height: 20px;
      font-weight: 500;
    }

    .status-msg.error { color: #f15c6d; }
    .status-msg.success { color: var(--wa-green); }

    /* WHATSAPP CHAT VIEW */
    .room-view {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      background: var(--wa-header);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--wa-border);
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: #6b7c85;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .user-info h2 {
      font-size: 0.98rem;
      font-weight: 600;
    }

    .user-info p {
      font-size: 0.75rem;
      color: var(--wa-green);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pin-badge {
      background: var(--wa-input-bg);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--wa-muted);
      cursor: pointer;
    }

    .btn-end {
      background: transparent;
      border: none;
      color: #f15c6d;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      margin-left: 8px;
    }

    /* CHAT WALLPAPER & MESSAGES */
    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #0b141a;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 16px 16px;
      scroll-behavior: smooth;
    }

    .chat-body::-webkit-scrollbar {
      width: 5px;
    }
    .chat-body::-webkit-scrollbar-thumb {
      background: var(--wa-header);
    }

    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px 6px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
      display: inline-block;
    }

    .msg-bubble.outgoing {
      align-self: flex-end;
      background: var(--wa-outgoing);
      border-top-right-radius: 2px;
      color: #e9edef;
    }

    .msg-bubble.incoming {
      align-self: flex-start;
      background: var(--wa-incoming);
      border-top-left-radius: 2px;
      color: #e9edef;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 0.68rem;
      color: rgba(241, 241, 241, 0.6);
      margin-top: 2px;
      float: right;
      margin-left: 12px;
    }

    .ticks {
      color: #53bdeb;
      font-weight: bold;
    }

    /* INPUT BAR */
    .chat-footer {
      background: var(--wa-header);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: var(--wa-input-bg);
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--wa-text);
      outline: none;
      font-size: 0.92rem;
    }

    .btn-send-icon {
      width: 42px;
      height: 42px;
      background: var(--wa-green);
      border: none;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="app-card">

    <!-- LOGIN SCREEN -->
    <div id="entryView" class="entry-container">
      <div class="logo-icon">💬</div>
      <h1>StudySync Web</h1>
      <p class="subtitle">End-to-End Direct Peer Chat</p>

      <div class="tab-group">
        <button class="tab-btn active" id="tabCreate" onclick="switchTab('create')">Host Room</button>
        <button class="tab-btn" id="tabJoin" onclick="switchTab('join')">Join Room</button>
      </div>

      <div class="pin-container">
        <input type="password" maxlength="1" class="pin-input" autofocus />
        <input type="password" maxlength="1" class="pin-input" />
        <input type="password" maxlength="1" class="pin-input" />
        <input type="password" maxlength="1" class="pin-input" />
      </div>

      <button class="btn-action" id="actionBtn" onclick="handleAction()">Start Host Room</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- WHATSAPP CHAT VIEW -->
    <div id="roomView" class="room-view">
      <div class="chat-header">
        <div class="header-user">
          <div class="avatar">👤</div>
          <div class="user-info">
            <h2 id="peerName">Study Peer</h2>
            <p>● online</p>
          </div>
        </div>

        <div style="display: flex; align-items: center;">
          <div class="pin-badge" onclick="copyPin()" title="Copy PIN">
            PIN: <strong id="activePinDisplay" style="color:var(--wa-text);">----</strong> 📋
          </div>
          <button class="btn-end" onclick="leaveRoom()">Exit</button>
        </div>
      </div>

      <div class="chat-body" id="chatBox"></div>

      <div class="chat-footer">
        <input type="text" id="msgInput" class="chat-input" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="btn-send-icon" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>

  <script>
    let peer = null;
    let conn = null;
    let currentMode = 'create';
    let currentPin = '';

    const inputs = document.querySelectorAll('.pin-input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
      });
    });

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('statusMsg').innerText = '';
      inputs.forEach(i => i.value = '');
      inputs[0].focus();

      document.getElementById('tabCreate').classList.toggle('active', mode === 'create');
      document.getElementById('tabJoin').classList.toggle('active', mode === 'join');
      document.getElementById('actionBtn').innerText = mode === 'create' ? 'Start Host Room' : 'Join Room';
    }

    function handleAction() {
      let pin = '';
      inputs.forEach(i => pin += i.value);
      const status = document.getElementById('statusMsg');

      if (pin.length < 4) {
        status.className = 'status-msg error';
        status.innerText = 'Please enter a 4-digit PIN.';
        return;
      }

      currentPin = pin;
      const peerId = 'studysync_pro_' + pin;

      if (currentMode === 'create') {
        status.className = 'status-msg success';
        status.innerText = 'Waiting for peer to join...';

        peer = new Peer(peerId);

        peer.on('open', () => {
          status.innerText = 'Room Live! Share PIN ' + pin + ' with peer.';
        });

        peer.on('connection', (connection) => {
          conn = connection;
          setupChat();
        });

        peer.on('error', (err) => {
          status.className = 'status-msg error';
          status.innerText = err.type === 'unavailable-id' ? 'PIN in use. Choose another.' : 'Network error.';
        });

      } else {
        status.className = 'status-msg success';
        status.innerText = 'Connecting...';

        peer = new Peer();

        peer.on('open', () => {
          conn = peer.connect(peerId);

          conn.on('open', () => {
            setupChat();
          });

          conn.on('error', () => {
            status.className = 'status-msg error';
            status.innerText = 'Connection failed. Verify PIN.';
          });
        });

        peer.on('error', () => {
          status.className = 'status-msg error';
          status.innerText = 'Room not found. Check host PIN.';
        });
      }
    }

    function setupChat() {
      document.getElementById('entryView').style.display = 'none';
      document.getElementById('roomView').style.display = 'flex';
      document.getElementById('activePinDisplay').innerText = currentPin;

      conn.on('data', (data) => {
        appendMessage(data, false);
      });

      conn.on('close', () => {
        alert('Peer left the room.');
        leaveRoom();
      });
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !conn) return;

      conn.send(text);
      appendMessage(text, true);
      input.value = '';
    }

    function appendMessage(text, isMine) {
      const chatBox = document.getElementById('chatBox');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isMine ? 'outgoing' : 'incoming');

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const ticks = isMine ? '<span class="ticks">✓✓</span>' : '';

      bubble.innerHTML = `${text} <div class="msg-meta">${timeStr} ${ticks}</div>`;

      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copyPin() {
      navigator.clipboard.writeText(currentPin);
      alert('Room PIN copied!');
    }

    function leaveRoom() {
      location.reload();
    }
  </script>
</body>
          </html>
